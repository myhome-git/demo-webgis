<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>综合态势展现系统-登录</title>
    <script>
    	if(window.top!=window.self){
			top.location.href = location.href;
		}
        document.writeln("<script src='Common.init.js?" + new Date().getTime() + "'><\/script>");
    </script>
    <script>
        Response([
            { "c": "common"},
            { "c": "./main.css"},
            { "j": "./main.js"},
            
            { "c": "./normalize.css"},
            { "j": "./polygonizr.js"}
        ]);
    </script>
    <!--<style>
    	#body-loading{
    		position: fixed;
    		left: 0;
    		top: 0;
    		z-index: 999;
    		width: 100%;
    		height: 100%;
    		background-color: #fff;
    	}
    	#body-loading.hide{
    		display: none;
    	}
    </style>-->
</head>
<body class="body-transparent skin-blue">
	<div class="body-loading" id="body-loading"></div>
    <div class="x-view-window" id="x-view-window">
        <div class="x-view-window-background" id="x-view-window-background"></div>
		<div class="x-view-content" id="x-view-content">
			<div class="x-view-login-window" id="x-view-login-window">
				
				<div class="login-background"></div>
				
				<!--系统标题-->
				<div class="system-logo">
					<div class="x-common-panel">
						<div class="x-panel-content">
							<div class="item-panel">
								<div class="item-left">
									<img src="image/logo.png"/>
								</div>
								<div class="item-right">
									<div class="">
										<div class="name-Chinese">
											<font>综 合 态 势 展 现 系 统</font>
										</div>
                                                                            <div class="name-English" hidden="">
											<font>Situation Visualization System</font>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				
				<!--系统输入-->
				<div class="login-input">
					<div class="x-common-panel">
						<div class="x-panel-content layui-form">
							<div class="item-panel">
								<div class="item-left">
									<i class="iconfont fa fa-user"></i>
								</div>
								<div class="item-right">
									<div class="">
										<input type="text" class="layui-input" placeholder="请输入用户名" autocomplete="off" x-out-name="username">
									</div>
								</div>
							</div>
							<div class="item-panel">
								<div class="item-left">
									<i class="iconfont fa fa-unlock-alt"></i>
								</div>
								<div class="item-right">
									<div class="">
										<input type="password" class="layui-input" placeholder="请输入密码" autocomplete="off" x-out-name="password">
									</div>
								</div>
							</div>
							<div class="item-panel">
								<div class="item-left">
									<i class="iconfont fa fa-shield"></i>
								</div>
								<div class="item-right verification-input">
									<div class="">
										<input type="text" class="layui-input" placeholder="请输入验证码" autocomplete="off" x-out-name="captcha">
										<div class="verification-code" id="verification-code">
											<img src=""/>
										</div>
									</div>
								</div>
							</div>
							<div class="item-panel" style="border: 0;">
								<div class="item-left" style="background:transparent;width: 0;overflow: hidden;">
									&nbsp;
								</div>
								<div class="item-right verification-input">
									<div class="">
										<button type="button" class="layui-btn" id="http-submit" >立即登录</button>
										<div style="clear: both;"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
    </div>
</body>
</html>
