<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>数据查询</title>
		<script src="../../../web.loader.init.js"></script>
        <script>
            Response([
            	"x.file.upload","guize.add.js"
            ]);
        </script>
		<style>
			body{
				overflow: auto;
			}
			#blog-add{
				margin: 10px 10px 0px 10px;
			}
			#blog-add .layui-form-item{
				outline: 0px solid #FF0000;
			}
			#blog-add .layui-form-label {
			    width: 80px;
			    outline: 0px solid #FF0000;
			    padding: 3px 5px;
			}
			#blog-add .layui-input-block {
			    margin-left: 80px;
			}
			#blog-add #submit{
				position: relative;
				z-index: 0!important;
			}
			#blog-add .layui-card{
				box-shadow: none;
			}
			#blog-add .layui-card-body{
				position: relative;
				padding: 0px 10px;
			}
			#blog-add .layui-card-body:after{
				display: block;
				content: "";
				clear: both;
				width: 0;
				height: 0;
				overflow: hidden;
			}
			
			#blog-add .layui-form-item{
				float: left;
				position: relative;
				clear: none;
				width: 100%;
				margin-bottom: 5px;
			}
			#blog-add .layui-form-item:after{
				content: "";
				clear: both;
				width: 0;
				height: 0;
				overflow: hidden;
			}
			.layui-anim.layui-anim-upbit{
				height: 160px;
				overflow: auto;
			}
			.layui-laydate{
				left: auto!important;
				top: 0px!important;
				right: 0!important;
			}
			#ImageView-company{
				display: block;
				width: 110px;
				height: 130px;
				border: 1px dotted #ddd;
			}
		
			.x-layui-colorpicker-box{
				display: block;
				position: absolute;
				right: 0;
				top: 0;
				cursor: pointer;
			}
			.x-layui-colorpicker-box > a{
				display: block;
				width: 100%;
				height: 100%;
				line-height: 30px;
				background-color: #1E9FFF;
				color: white;
				padding: 0px 5px 0px 5px;
			}
		</style>
	</head>
	<body class="skin-black" user-check="zhts">
		<div class="x-view-window">
			<div class="x-view-content">
				<div id="blog-add" class="layui-form">
					<div style="padding: 0;">
						<div class="layui-row layui-col-space15">
							<div class="layui-col-md12" id="form-input">
								<div class="layui-card">
									<!--<div class="layui-card-header x-clearfix">
										<i class="iconfont fa fa-add"></i>
										<font x-input-name="page_action">新增设备</font>
									</div>-->
									<div class="layui-card-body">
		                                <div class="layui-form-item">
											<input type="hidden" x-input-name="id" x-out-name="id" class="layui-input" autocomplete="off">
											<label class="layui-form-label">规则名称：</label>
											<div class="layui-input-block">
												<input type="text" x-input-name="name" x-out-name="name" class="layui-input" autocomplete="off">
											</div>
										</div>
										<div class="layui-form-item">
											<label class="layui-form-label">规则类型：</label>
											<div class="layui-input-block" id="temp_guizeleixing">
												<!--<input type="radio" name="type" x-out-name="type"  x-input-name="type" value="1" title="禁入规则" checked>-->
												<!--<input type="radio" name="type" x-out-name="type"  x-input-name="type" value="2" title="禁出规则">-->
											</div>
										</div>
										<div class="layui-form-item">
											<label class="layui-form-label">区域类型：</label>
											<div class="layui-input-block" id="temp_quyuleixing">
												<input type="radio" name="regionType" x-out-name="regionType"  x-input-name="regionType" value="1" title="自定义区域" checked>
												<input type="radio" name="regionType" x-out-name="regionType"  x-input-name="regionType" value="2" title="行政区域">
											</div>
										</div>
										<div class="layui-form-item">
											<label class="layui-form-label">区域名称：</label>
											<div class="layui-input-block">
												<select x-input-name="regionId" x-out-name="regionId" lay-search></select>
											</div>
										</div>
										<div class="layui-form-item">
											<label class="layui-form-label">是否通用：</label>
											<div class="layui-input-block" id="temp_quyuleixing">
												<input type="radio" name="share" x-out-name="share"  x-input-name="share" value="true" title="通用" lay-filter="share" checked>
												<!--<input type="radio" name="share" x-out-name="share"  x-input-name="share" value="false" title="不通用" lay-filter="share">-->
											</div>
										</div>
										<!--<div class="layui-form-item">
											<label class="layui-form-label">绑定规则：</label>
											<div class="layui-input-block">
												<input type="text" x-input-name="targetName" x-out-name="targetName" class="layui-input" autocomplete="off" disabled="">
											</div>
										</div>-->
										<div class="layui-form-item">
											<label class="layui-form-label">时间范围：</label>
											<div class="layui-input-block item-right">
												<input type="text" class="layui-input input-time" placeholder="" autocomplete="off" name="timeRange" id="layui-timeRange" x-out-name="timeRange"  x-input-name="timeRange">
												<div class="x-layui-colorpicker-box">
													<a x-btn-name="button-open-layui-date-select">选择</a>
												</div>
											</div>
										</div>
										
										<div class="layui-form-item" style="width: 100%;">
											<label class="layui-form-label">报警信息：</label>
											<div class="layui-input-block">
												<textarea x-input-name="alarmMsg" x-out-name="alarmMsg" class="layui-textarea" autocomplete="off" style="height: 80px;"></textarea>
											</div>
										</div>
									</div>
								</div>
							</div>
							
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
