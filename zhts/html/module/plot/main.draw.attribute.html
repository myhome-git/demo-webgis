<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>标绘面板</title>
		<script src="../../../web.loader.init.js"></script>
        <script>
            Response([
            	"_ClassDrawAttributeOBJECT.js",
            	"_ClassDrawAttributeSTATIC_ICON.js","_ClassDrawAttributeSTATIC_FONT.js","_ClassDrawAttributeSTATIC_MIAOSHU.js",
            	"_ClassDrawAttributeDRAW_ICON.js","_ClassDrawAttributeDRAW_FONT.js","_ClassDrawAttributeDRAW_MIAOSHU.js",
            	"_ClassDrawAttributeMain.js",
            	"main.draw.attribute.css","main.draw.attribute.js"
            ]);
        </script>
		<style>
			body{
				overflow: hidden;
			}
			.x-view-content{
				height: 100%;
				display: none;
			}
			.x-view-content.open{
				display: block;
			}
			.item-panel .item-left{
				width: 80px;
				padding-right : 5px
			}
			.item-panel .item-right{
				width: calc(100% - 80px);
			}
		</style>
	</head>
	<body class="skin-black" user-check="zhts">
		<div class="x-view-window" id="x-view-window">
			<div class="x-view-content" id="x-view-content"></div>
		</div>
	</body>
</html>
<!--通用-->
<script id="TemplatePanelDrawAttributeOBJECT" type="text/html">
{{if isRun==true}}
	<div class="panel-attribute">
		<div class="x-common-panel">
			<div class="x-panel-title">
				<i class="iconfont x-icon-zhuce"></i>
				<font>{{name}}</font>
			</div>
			<div class="x-panel-content layui-form">
				{{each data as value index}}
				<div class="item-panel">
					<div class="item-left">
						<font>{{value.name}}：</font>
					</div>
					<div class="item-right">
						<div class="">
							{{if value['control-type']=="color"}}
								<div class="button" x-control-type={{value['control-type']}}>
									<a class="layui-btn-fluid">选择</a>
									<div id="BUTTON-{{type}}-{{value.id}}" class="layui-btn-control-type-color"></div>
								</div>
								<input type="text" id="INPUT-{{type}}-{{value.id}}"
									class="layui-input" 
									placeholder="{{value.placeholder}}" 
									autocomplete="off" 
									name="{{value.id}}" 
									x-input-name="{{value.id}}" 
									x-out-name="{{value.id}}" 
									value="{{value.value}}" 
									style="padding-right: 38px;"
									>
							{{else if value['control-type']=="select"}}
								<select name="modules" lay-verify="required" lay-search="">
									{{each value.value as v i}}
										<option value="{{v.id}}">{{v.name}}</option>
									{{/each}}
								</select>
							{{else}}
								<input type="text" id="INPUT-{{type}}-{{value.id}}" 
									class="layui-input" 
									placeholder="{{value.placeholder}}" 
									autocomplete="off" 
									name="{{value.id}}" 
									x-input-name="{{value.id}}" 
									x-out-name="{{value.id}}" 
									value="{{value.value}}">
							{{/if}}
						</div>
					</div>
				</div>
				{{/each}}
			</div>
		</div>
	</div>
{{else}}
	
{{/if}}
</script>
