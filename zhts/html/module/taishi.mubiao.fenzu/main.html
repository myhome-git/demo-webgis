<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>电子围栏</title>
		<script src="../../../web.loader.init.js"></script>
        <script>
            Response([
            	"main.json.js","main.js"
            ]);
        </script>
		<style>
			#input-search-from > div{
				float: left;
				height: 28px;
				line-height: 28px;
				overflow: hidden;
			}
			#input-search-from > div > .layui-btn{
				margin-top: -3px;
				margin-left: -1px;
			}
            #input-search-from .layui-btn{
				border-width: 1px;
				border-style: solid;
                border-radius: 0;
				font-size: 16px;
            }
            .skin-black #input-search-from .layui-btn{
            	background-color: rgba(35, 119, 227, .3);
            	border-color: rgba(255,255,255, .3);
            	color: white;
            }
            
            #input-search-from .btn-guize-group .layui-btn{
				font-size: 13px;
			}
			#input-search-from .btn-guize-group .layui-btn.action{
				background-color: rgba(35, 119, 227, 1);
				border: 1px solid rgba(35, 119, 227, 0.9);
				color: #fff;
			}
			.tree-menu{
				border-bottom: 1px solid rgba(142,171,215,.5);
				padding: 5px 5px 5px 5px;
			}
			.fenzu-item{
				height: 100%;
			}
			.fenzu-item > div{
				float: left;
				height: 100%;
			}
			.fenzu-item .item-left{
				width: 190px;
				border-right: 1px solid rgba(142,171,215,.5);
			}
			.fenzu-item .item-right{
				margin-left: 5px;
				width: calc(100% - 200px);
			}
			.ztree li a.curSelectedNode{
				background-color: rgba(229,229,229,.25);
			}
		</style>
	</head>
	<body class="skin-black" user-check="zhts">
		<div class="x-view-window" id="x-view-window">
		<!--<div class="x-common-panel" style="margin-left: 2px;margin-right: 2px;margin-bottom: 1px;padding: 10px;">-->
			<div class="window-x-tabs" style="height: 100%;">
				<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief" style="height: 100%;">
				  <ul class="layui-tab-title layui-hide">
				  	<li module-tab-title-name="fenzuguanli">态势分组</li>
				  </ul>
				  <div class="layui-tab-content" style="height: 100%;padding: 0;">
				    <div class="layui-tab-item clearfix" module-tab-item-name="fenzuguanli" style="height: 100%;">
				    	<div class="fenzu-item">
				    		<div class="item-left" id="tree-box">
					    		<div class="tree-menu clearfix" style="">
					    			<div style="float: right;">
					    				<button class="layui-btn layui-btn-xs" x-btn-name="add">新建</button>
					    				<button class="layui-btn layui-btn-xs" x-btn-name="clear">刷新</button>
						    			<button class="layui-btn layui-btn-normal layui-btn-xs" x-btn-name="update">修改</button>
						    			<button class="layui-btn layui-btn-danger layui-btn-xs" x-btn-name="delete">删除</button>
					    			</div>
					    		</div>
					    		<div id="ssts-group-tree"></div>
					    	</div>
					    	<div class="item-right">
					    		<div class="x-common-panel">
									<div id="ElementTemplateMainDataSearchINPUT"></div>
								</div>
								<div class="x-common-panel">
									<div id="layui-table-scrollbar-1">
										<div id="layui-table-search-data-QUYUGUANLI"></div>
									</div>
								</div>
					    	</div>
				    	</div>
				    </div>
				</div>
			</div>
		</div>
	</body>
</html>
<!--表格搜索项-区域管理-->
<script type="text/html" id="TemplateTableToolbar">
<div>
	<div class="x-panel-title layui-table-tool-title x-clearfix" id="layui-table-top-toolbar">
		<i class="iconfont glyphicon glyphicon-th-list"></i>
		<font>数据列表</font>
		<font style="margin-left: 30px;"></font>
		<button type="button" class="layui-btn layui-btn-xs" lay-event="table-refresh">刷新数据</button>
		<button type="button" class="layui-btn layui-btn-xs layui-btn-danger" lay-event="table-delete-multiple">批量删除</button>
	</div>
</div>
</script>
<script type="text/html" id="TemplateTableSearchTABLEQUYUGUANLI">
{{if isRun==true}}
	<div class="x-common-panel layui-form" style="padding: 0;border: 0;">
		<div class="x-panel-content layui-form x-clearfix" style="padding: 10px 0px;" id="input-search-from">
			<div class="layui-inline" style="margin-left: 0;">
				<input type="text" class="layui-input" placeholder="名称" autocomplete="off"  x-input-name="mbmc" style="">
			</div>
			<div class="layui-inline">
				<button type="button" x-btn-name="button-search" class="layui-btn layui-btn-sm layui-btn-normal" style="height: 28px;line-height: 28px;">
					<i class="iconfont glyphicon glyphicon-search"></i>
				</button>
			</div>
			<div style="float: right;">
				<font>范围选择：</font>
				<button type="button" x-btn-name="button-add-circle" class="layui-btn layui-btn-sm layui-btn-normal" title="圆形">
					<i class="iconfont fa fa-circle-o"></i>
				</button>
				<button type="button" x-btn-name="button-add-polygon" class="layui-btn layui-btn-sm layui-btn-normal" title="多边形" style="margin-left: 3px;">
					<i class="iconfont fa fa-connectdevelop"></i>
				</button>
				<button type="button" x-btn-name="button-clear" class="layui-btn layui-btn-sm layui-btn-normal" title="清除" style="margin-left: 3px;">
					<i class="iconfont fa fa-trash"></i>
				</button>
			</div>
		</div>
	</div>
{{/if}}
</script>

<!--工具栏-->
<script type="text/html" id="TemplateTableCellBarToolTABLE">
<div>
    <button type="button" class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
</div>
</script>
<script type="text/html" id="switchTpl">
  <!-- 这里的 checked 的状态只是演示 -->
  <input type="checkbox" name="enableSwitch" x-bind-id="{{d.id}}" value="{{d.enable}}" lay-skin="switch" lay-text="是|否" lay-filter="enableSwitch" {{ d.enable == true ? 'checked' : '' }}>
</script>
<script type="text/html" id="TemplateTableCellBarToolTABLEXIAOXIGUANLI">
<div>
	<button type="button" class="layui-btn layui-btn-xs" lay-event="select">查看</button>
    <button type="button" class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete">删除</button>
</div>
</script>
