<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>网络分析</title>
		<link rel="stylesheet" href="test.css">
		<script src="jquery-1.8.3.js"></script>
		<script src="./d3-v3/d3.js"></script>
		<script src="x.util.base.js"></script>
		<style>
			#x-view-window{
				position: fixed;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				overflow: auto;
			}
			#x-view-content{
				position: absolute;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
			}
			#x-view-content > #svg-box{
				display: block;
				margin: auto;
				position: absolute;
				top: 0;
				left: 0;
				bottom: 0;
				right: 0;
				outline: 1px solid red;
			}
		</style>
	</head>
	<body>
		<div id="x-hidden-window" style="position: fixed;left: 0;top: 0;width: 100%;height: 100%;z-index: -1;"></div>
		<div class="x-view-window" id="x-view-window">
			<div class="x-view-content" id="x-view-content">
				<div id="svg-box"></div>
			</div>
		</div>
		<script src="index.js"></script>
	</body>
</html>
