		<script>
        	Response([
        		{"c" : "fontAwesome"},
        		{"c" : "layui.245"},
				{"j" : "layui.245"},
        		{"c" :　"x.ztree"},
				{"j" : "x.ztree"},
				{"j" : "x.template"},
				{"c" :　"mCustomScrollbar"},
				{"j" : "mCustomScrollbar"},
        		{"c" : "common"},
        		{"j" : "x.util.base"},
        		{"j" : "x.file.upload.main"},
        		{"j" : window.Common.Config.PROBJECT_PATH+"/xUtilBase.ext.js"},

        	]);
        </script>

    <body class="body-transparent">
    	<div id="x-view-window" class="x-view-window">
    		<div id="iframe-3dmodel">
    			<div id="model-main"></div>
    		</div>
    		<div id="x-view-layer-control" class="layui-form">
    			<div id="x-view-model-panel">
    				<div id="x-view-model-list-panel">
	    				<div class="x-common-panel">
	    					<div class="x-panel-title" style="">
	    						<span class="layui-breadcrumb">
								  <a>模型列表</a>
								</span>
			                    <div class="btn-close">
			                        <i class="iconfont fa fa-close"></i>
			                    </div>
			                </div>
	    				</div>
			    		<ul id="x-view-model-tree"></ul>
	    			</div>
	    			<div id="x-view-model-children-tree-panel" class="panel-hidden">
	    				<div class="x-common-panel">
	    					<div class="x-panel-title" style="">
	    						<span class="layui-breadcrumb">
								  <a href="#" x-button-name='OpenPanelModelList' title="单击返回模型列表">返回模型列表</a>
								  <a>
								  	模型节点
								  	<!--<input type="checkbox" name="model-children-view-switch" lay-filter="model-children-view-switch" title="预览" lay-skin="primary">-->
								  	<input type="checkbox" name="model-children-view-switch" lay-filter="model-children-view-switch" autocomplete="off" lay-skin="switch" lay-text="预览|预览">
								  </a>
								</span>
			                    <div class="btn-close">
			                        <i class="iconfont fa fa-close"></i>
			                    </div>
			                </div>
			                <div class="x-panel-title" style="line-height: 1.4;height: auto;padding: 0;margin: 5px;border: 0;">
    							<input type="text" x-input-name="searchTreeNodeName" x-out-name="searchTreeNodeName" class="layui-input" autocomplete="off" placeholder="搜索...">
    							<div class="btn-search-close panel-hidden">
    								<i class="iconfont fa fa-close"></i>
    							</div>
			                </div>
	    				</div>
	    				<div id="x-view-model-children-tree-scrollbar" class="diy-scrollbar">
	    					<ul id="x-view-model-children-tree"></ul>
	    					<ul id="x-view-model-children-tree-search" class="panel-hidden"></ul>
	    				</div>
			    	</div>
			    	<div id="x-view-content-right-panel">
			    		<div class="x-clearfix">
			    			<div id="x-view-model-name-left">
			    				<div id="x-view-model-name"></div>
			    				<div id="x-view-model-action-name"></div>
			    			</div>
			    			<div id="x-view-model-children-menu" class="x-clearfix panel-hidden">
			    				<!--<div class="layui-btn-group">
								    <button type="button" class="layui-btn layui-btn-sm">定位</button>
								</div>-->
								<div class="layui-btn-group">
								    <button type="button" class="layui-btn layui-btn-sm" x-button-name="httpSaveModelView">调整模型参数</button>
								</div>
								<div class="layui-btn-group">
									<button type="button" class="layui-btn layui-btn-sm" x-button-name="setLockModel">锁定模型</button>
								    <button type="button" class="layui-btn layui-btn-sm" x-button-name="PlayModelAnimate">播放模型动画</button>
								</div>
								<div class="layui-btn-group">
								    <button type="button" class="layui-btn layui-btn-sm" x-button-name="load-model-children-param">编辑选中节点参数</button>
								</div>
			    			</div>
			    		</div>
		    		</div>
    			</div>
    			<div id="x-view-model-children-edit-panel" class="panel-hidden"></div>
    		</div>
    	</div>
    	<div id="model-test" style="display: none;">
    		<ul>
    			<li>
    				<button x-button-name="loadModel">加载模型</button>
    			</li>
    			<li>
    				<button x-button-name="resolveModelNodeAllList">解析模型子节点</button>
    				<button x-button-name="resolveModelNodeAnimateList">解析模型子动画</button>
    			</li>
    			<li>
    				<button x-button-name="childrenNodeShow">节点显示</button>
    				<button x-button-name="childrenNodeHidden">节点隐藏</button>
    			</li>
    			<li>
    				<button x-button-name="childrenNodeAlphaColor">节点透明(30%)</button>
    				<button x-button-name="childrenNodeAlphaColorNo">节点不透明</button>
    			</li>
    		</ul>
		</div>

				{"j" : "/model3d/3dmodel/3d.model.panel.model.param.setting.js"},
